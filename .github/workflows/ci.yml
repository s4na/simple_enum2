name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.7'
            gemfile: Gemfile
          - ruby: '2.7'
            gemfile: gemfiles/rails-5.1.gemfile
          - ruby: '2.7'
            gemfile: gemfiles/rails-5.2.gemfile
          - ruby: '2.7'
            gemfile: gemfiles/rails-6.1.gemfile
          - ruby: '3.0'
            gemfile: gemfiles/rails-6.1.gemfile
          - ruby: '3.1'
            gemfile: gemfiles/rails-6.1.gemfile
          - ruby: '3.1'
            gemfile: gemfiles/rails-7.2.gemfile
          - ruby: '3.2'
            gemfile: gemfiles/rails-7.2.gemfile
          - ruby: '3.3'
            gemfile: gemfiles/rails-7.2.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/rails-7.2.gemfile
          - ruby: '3.2'
            gemfile: gemfiles/rails-8.1.gemfile
          - ruby: '3.3'
            gemfile: gemfiles/rails-8.1.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/rails-8.1.gemfile
          - ruby: '4.0'
            gemfile: gemfiles/rails-8.1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs (without mongoid)
        run: bundle exec rspec spec/ -t ~mongoid

  coverage:
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: gemfiles/rails-6.1.gemfile
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Run specs with coverage
        run: bundle exec rspec spec/ -t ~mongoid

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
